---
services:
  lama:
    image: ollama/ollama
    container_name: alter-lama
    restart: always
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "2000:11434"
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list 2>/dev/null; do sleep 2; done; ollama pull qwen2.5:3b; wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q qwen2"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s  # ~4 GB download on first boot
    environment:
      OLLAMA_NO_MMAP: "false"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_NUM_PARALLEL: "1"
    mem_limit: 4g
    memswap_limit: 4g

volumes:
  ollama-data:
